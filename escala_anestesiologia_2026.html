<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala · Anestesiologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F5F2EA;
  --card:#FFFFFF;
  --ink:#1C2E29;
  --ink-soft:#647069;
  --ink-faint:#9AA39C;
  --day:#2C6E5F;
  --day-soft:#E3EFEA;
  --day-line:#CFE3DB;
  --night:#3E3A72;
  --night-soft:#E9E7F6;
  --night-line:#D6D2ED;
  --special:#AE5226;
  --special-soft:#F6E5D9;
  --special-line:#EBC9AF;
  --edited:#B9800F;
  --edited-soft:#FBF0D8;
  --edited-line:#EFD394;
  --line:#E6E0D1;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow: 0 1px 2px rgba(28,46,41,0.04), 0 8px 24px -12px rgba(28,46,41,0.18);
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at top left, rgba(44,110,95,0.06), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(174,82,38,0.05), transparent 50%);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:560px; margin:0 auto; padding:0 0 48px; min-height:100vh; position:relative;}

/* ---------- header ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background: linear-gradient(180deg, var(--bg) 82%, rgba(245,242,234,0));
  padding:22px 20px 10px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  flex-wrap:wrap;
}
.eyebrow{
  position:absolute; top:8px; left:0; right:0; text-align:center;
  font-size:10.5px; letter-spacing:0.16em; font-weight:700; color:var(--ink-faint);
}
.datenav{display:flex; align-items:center; gap:6px; margin-top:14px;}
.navbtn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-size:20px; line-height:1;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:var(--shadow);
}
.navbtn:active{transform:scale(0.92);}
.datebtn{
  background:none; border:none; cursor:pointer; padding:2px 14px;
  display:flex; flex-direction:column; align-items:center; gap:0px; color:var(--ink);
  font-family:inherit;
}
.dow{font-size:12.5px; color:var(--ink-soft); text-transform:capitalize; font-weight:600; letter-spacing:0.02em;}
.bigdate{font-family:'Fraunces',serif; font-size:44px; font-weight:600; line-height:1.02; letter-spacing:-0.01em;}
.slash{color:var(--ink-faint); font-weight:400; margin:0 2px;}
.year{font-size:11.5px; color:var(--ink-faint); font-weight:600; letter-spacing:0.08em;}
.todaybtn{
  border:1px solid var(--day-line); background:var(--day-soft); color:var(--day);
  font-weight:700; font-size:12px; padding:7px 13px; border-radius:20px; cursor:pointer;
  position:absolute; right:14px; top:20px;
}
#dateInput{position:absolute; opacity:0; pointer-events:none; width:1px; height:1px;}

/* ---------- week strip ---------- */
.weekstrip{
  display:flex; gap:8px; overflow-x:auto; padding:6px 20px 18px;
  scroll-snap-type:x proximity;
}
.weekstrip::-webkit-scrollbar{display:none;}
.daychip{
  flex:0 0 auto; width:50px; scroll-snap-align:center;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:9px 0 10px; border-radius:16px; cursor:pointer;
  border:1px solid transparent; background:transparent;
}
.daychip .cdow{font-size:10px; font-weight:700; text-transform:uppercase; color:var(--ink-faint); letter-spacing:0.03em;}
.daychip .cnum{font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--ink);}
.daychip .cdot{width:4px; height:4px; border-radius:50%; margin-top:1px; background:transparent;}
.daychip.weekend{background:var(--special-soft);}
.daychip.weekend .cdow, .daychip.weekend .cnum{color:var(--special);}
.daychip.holiday .cdot{background:var(--special);}
.daychip.selected{background:var(--ink); border-color:var(--ink);}
.daychip.selected .cdow, .daychip.selected .cnum{color:#fff;}
.daychip.selected .cdot{background:#fff;}

/* ---------- content ---------- */
main{padding:4px 16px 20px; display:flex; flex-direction:column; gap:16px;}

.card{
  background:var(--card); border-radius:var(--radius-lg); padding:18px 18px 10px;
  box-shadow:var(--shadow); border:1px solid rgba(28,46,41,0.05);
}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px;}
.card-title{display:flex; align-items:center; gap:9px;}
.card-title .ico{
  width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:15px; flex:0 0 auto;
}
.card-title h2{font-size:15px; margin:0; font-weight:800; letter-spacing:-0.01em;}
.card-title .sub{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:1px;}
.badge{font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:20px; letter-spacing:0.02em;}

.card.day .ico{background:var(--day-soft); color:var(--day);}
.card.night .ico{background:var(--night-soft); color:var(--night);}
.card.special .ico{background:var(--special-soft); color:var(--special);}
.badge.day{background:var(--day-soft); color:var(--day);}
.badge.night{background:var(--night-soft); color:var(--night);}
.badge.special{background:var(--special-soft); color:var(--special);}

.rows{margin-top:10px; display:flex; flex-direction:column;}
.row{
  display:flex; align-items:center; gap:12px; padding:10px 4px;
  border-top:1px solid var(--line); cursor:pointer; border-radius:10px;
  transition:background .12s ease;
}
.row:first-child{border-top:none;}
.row:active{background:rgba(28,46,41,0.035);}
.step{
  width:30px; height:30px; border-radius:50%; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  color:#fff;
}
.rowmain{flex:1; min-width:0;}
.rowname{font-size:15.5px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:6px;}
.rowmeta{font-size:11.5px; color:var(--ink-soft); margin-top:1px; font-weight:500;}
.pencil{color:var(--ink-faint); font-size:14px; flex:0 0 auto; padding:4px;}
.crown{font-size:12px;}
.edited-tag{
  font-size:9.5px; font-weight:800; color:var(--edited); background:var(--edited-soft);
  border:1px solid var(--edited-line); padding:1px 6px; border-radius:8px; letter-spacing:0.03em;
}
.row.is-edited{background:var(--edited-soft); box-shadow: inset 3px 0 0 var(--edited);}
.row.is-edited .rowname{color:#7A5608;}

.single-slot{
  display:flex; align-items:center; gap:14px; padding:14px 4px 16px; cursor:pointer; border-radius:12px;
}
.single-slot:active{background:rgba(28,46,41,0.035);}
.single-slot .avatar{
  width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:#fff; flex:0 0 auto;
}
.single-slot .sname{font-size:19px; font-weight:800; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px;}
.single-slot .smeta{font-size:12px; color:var(--ink-soft); font-weight:600; margin-top:2px;}

.split-label{
  font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint);
  margin:14px 0 2px; padding-top:10px; border-top:1px dashed var(--line);
}
.split-label:first-of-type{border-top:none; margin-top:2px;}

.section-gap{height:2px;}

.dateflash{
  text-align:center; font-size:12px; color:var(--ink-faint); padding:2px 0 4px; font-weight:600;
}
.legend-note{
  font-size:11px; color:var(--ink-faint); text-align:center; padding:6px 20px 0; line-height:1.5;
}

/* ---------- footer ---------- */
.info-footer{margin:6px 16px 0; }
.info-toggle{
  width:100%; background:none; border:none; display:flex; align-items:center; justify-content:space-between;
  padding:12px 6px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
}
.chev{transition:transform .2s ease; color:var(--ink-faint);}
.info-toggle.open .chev{transform:rotate(180deg);}
.info-body{max-height:0; overflow:hidden; transition:max-height .25s ease; padding:0 6px;}
.info-body.open{max-height:200px; padding-bottom:10px;}
.info-row{display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line); color:var(--ink-soft);}
.info-row strong{color:var(--ink); font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px;}
.info-note{font-size:11.5px; color:var(--ink-faint); line-height:1.5; margin:10px 0 0;}

/* ---------- sheet ---------- */
.sheet-backdrop{
  position:fixed; inset:0; background:rgba(20,28,25,0.42); z-index:50;
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.sheet-backdrop.open{opacity:1; pointer-events:auto;}
.sheet{
  background:var(--card); width:100%; max-width:560px; border-radius:24px 24px 0 0;
  padding:10px 20px 26px; transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
  max-height:80vh; overflow-y:auto;
}
.sheet-backdrop.open .sheet{transform:translateY(0);}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:4px; margin:4px auto 14px;}
.sheet-title{font-family:'Fraunces',serif; font-size:21px; font-weight:600; text-align:center;}
.sheet-sub{font-size:12.5px; color:var(--ink-soft); text-align:center; margin-top:2px; margin-bottom:16px; font-weight:600;}
.roster{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.roster button{
  padding:12px 10px; border-radius:14px; border:1.5px solid var(--line); background:#fff;
  font-family:inherit; font-size:14.5px; font-weight:700; color:var(--ink); cursor:pointer; text-align:left;
}
.roster button.current{border-color:var(--ink); background:var(--ink); color:#fff;}
.restore-btn{
  width:100%; margin-top:16px; padding:12px; border-radius:14px; border:1.5px dashed var(--edited-line);
  background:var(--edited-soft); color:var(--edited); font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;
}
.cancel-btn{
  width:100%; margin-top:8px; padding:12px; border-radius:14px; border:none; background:none;
  color:var(--ink-faint); font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;
}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:30px; font-size:13px; font-weight:600;
  opacity:0; pointer-events:none; transition:all .25s ease; z-index:60; white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.search-fab{
  margin:6px 16px 0; width:calc(100% - 32px);
  display:flex; align-items:center; justify-content:center; gap:9px;
  padding:14px 16px; border-radius:16px; border:1.5px dashed var(--day-line);
  background:var(--day-soft); color:var(--day); font-weight:700; font-size:13.5px;
  cursor:pointer; font-family:inherit;
}
.search-ico{font-size:15px;}
.footer-hint{
  font-size:11px; color:var(--ink-faint); text-align:center; line-height:1.5;
  padding:14px 30px 4px; margin:0;
}

.sheet-tall{max-height:88vh; display:flex; flex-direction:column;}
.search-tabs{display:flex; gap:8px; margin:4px 0 14px;}
.search-tab{
  flex:1; padding:10px; border-radius:12px; border:1.5px solid var(--line); background:#fff;
  font-family:inherit; font-weight:700; font-size:13px; color:var(--ink-soft); cursor:pointer;
}
.search-tab.active{background:var(--ink); border-color:var(--ink); color:#fff;}

.search-panel{margin-bottom:10px;}
.name-chips{display:flex; flex-wrap:wrap; gap:7px;}
.name-chips button{
  padding:8px 13px; border-radius:20px; border:1.5px solid var(--line); background:#fff;
  font-family:inherit; font-weight:700; font-size:12.5px; color:var(--ink); cursor:pointer;
}
.name-chips button.active{background:var(--day); border-color:var(--day); color:#fff;}

.month-chips{display:flex; flex-wrap:wrap; gap:7px;}
.month-chips button{
  padding:8px 12px; border-radius:20px; border:1.5px solid var(--line); background:#fff;
  font-family:inherit; font-weight:700; font-size:12.5px; color:var(--ink); cursor:pointer; text-transform:capitalize;
}
.month-chips button.active{background:var(--night); border-color:var(--night); color:#fff;}

.search-results{
  overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; padding-top:4px;
  border-top:1px solid var(--line); margin-top:4px;
}
.result-empty{font-size:12.5px; color:var(--ink-faint); text-align:center; padding:24px 10px;}
.result-row{
  display:flex; align-items:center; gap:12px; padding:11px 6px; border-radius:12px; cursor:pointer;
  border-bottom:1px solid var(--line);
}
.result-row:active{background:rgba(28,46,41,0.035);}
.result-date{
  width:46px; flex:0 0 auto; text-align:center; font-family:'Fraunces',serif; font-weight:600;
}
.result-date .rd-num{font-size:19px; line-height:1; display:block;}
.result-date .rd-mon{font-size:9.5px; color:var(--ink-faint); text-transform:uppercase; font-weight:700; letter-spacing:0.03em;}
.result-main{flex:1; min-width:0;}
.result-name{font-size:14.5px; font-weight:700;}
.result-meta{font-size:11px; color:var(--ink-soft); font-weight:600; margin-top:1px; text-transform:capitalize;}
.result-badge{
  font-size:9.5px; font-weight:800; padding:3px 8px; border-radius:20px; letter-spacing:0.02em; flex:0 0 auto;
}
.result-badge.sat, .result-badge.sun{background:var(--special-soft); color:var(--special);}
.result-badge.hol{background:var(--night-soft); color:var(--night);}

@media (max-width:380px){
  .bigdate{font-size:38px;}
  .roster{grid-template-columns:1fr 1fr;}
}

</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="eyebrow">ESCALA · ANESTESIOLOGIA 2026</div>
    <div class="datenav">
      <button class="navbtn" id="prevBtn" aria-label="Dia anterior">‹</button>
      <button class="datebtn" id="dateOpenBtn">
        <span class="dow" id="dowLabel">quarta</span>
        <span class="bigdate"><span id="dayNum">18</span><span class="slash">/</span><span id="monNum">08</span></span>
        <span class="year" id="yearLabel">2026</span>
      </button>
      <button class="navbtn" id="nextBtn" aria-label="Próximo dia">›</button>
    </div>
    <button class="todaybtn" id="todayBtn">hoje</button>
    <input type="date" id="dateInput" min="2026-01-01" max="2026-12-31" value="2026-08-18">
  </header>

  <div class="weekstrip" id="weekStrip"></div>

  <main id="content"></main>

  <button class="search-fab" id="searchOpenBtn">
    <span class="search-ico">🔍</span>
    <span>Consultar plantões de fim de semana e feriado</span>
  </button>

  <p class="footer-hint">Toque em qualquer nome no card acima para trocar o plantonista. As alterações ficam guardadas neste navegador (funciona offline) e aparecem marcadas em âmbar.</p>
</div>

<div class="sheet-backdrop" id="searchBackdrop">
  <div class="sheet sheet-tall" id="searchSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Consultar plantões</div>
    <div class="sheet-sub">Fins de semana e feriados de 2026</div>

    <div class="search-tabs">
      <button class="search-tab active" id="tabByName" data-tab="name">Por nome</button>
      <button class="search-tab" id="tabByDate" data-tab="date">Por data</button>
    </div>

    <div id="panelByName" class="search-panel">
      <div class="name-chips" id="nameChips"></div>
    </div>

    <div id="panelByDate" class="search-panel" style="display:none;">
      <div class="month-chips" id="monthChips"></div>
    </div>

    <div class="search-results" id="searchResults"></div>

    <button class="cancel-btn" id="searchCancelBtn">Fechar</button>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">Trocar plantonista</div>
    <div class="sheet-sub" id="sheetSub"></div>
    <div class="roster" id="rosterList"></div>
    <button class="restore-btn" id="restoreBtn">↺ Restaurar escala original</button>
    <button class="cancel-btn" id="cancelBtn">Cancelar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

const DOW_NAMES = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const DOW_SHORT = ["dom","seg","ter","qua","qui","sex","sáb"];
const MON_NAMES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];


let selected = new Date(2026,7,18); // 18 Aug 2026
let overridesCache = {};
let pendingSlot = null; // {dateISO, key, label, currentName}

function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function fromISO(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function hasLocalStorage(){
  try{
    const k = "__test__";
    localStorage.setItem(k,"1");
    localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const STORAGE_OK = hasLocalStorage();

async function getOverrides(dateISO){
  if(overridesCache[dateISO]) return overridesCache[dateISO];
  let ov = {};
  try{
    if(STORAGE_OK){
      const raw = localStorage.getItem('escala2026_'+dateISO);
      if(raw) ov = JSON.parse(raw);
    }
  }catch(e){}
  overridesCache[dateISO] = ov;
  return ov;
}
async function saveOverride(dateISO, key, name){
  const ov = await getOverrides(dateISO);
  ov[key] = name;
  overridesCache[dateISO] = ov;
  try{ if(STORAGE_OK) localStorage.setItem('escala2026_'+dateISO, JSON.stringify(ov)); }catch(e){}
}
async function clearOverrideKey(dateISO, key){
  const ov = await getOverrides(dateISO);
  delete ov[key];
  overridesCache[dateISO] = ov;
  try{ if(STORAGE_OK) localStorage.setItem('escala2026_'+dateISO, JSON.stringify(ov)); }catch(e){}
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

function renderHeader(){
  const d = selected;
  document.getElementById('dowLabel').textContent = DOW_NAMES[d.getDay()];
  document.getElementById('dayNum').textContent = String(d.getDate()).padStart(2,'0');
  document.getElementById('monNum').textContent = String(d.getMonth()+1).padStart(2,'0');
  document.getElementById('yearLabel').textContent = d.getFullYear();
  document.getElementById('dateInput').value = iso(d);
}

function renderWeekStrip(){
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = '';
  const base = new Date(selected);
  for(let i=-3;i<=3;i++){
    const d = new Date(base);
    d.setDate(base.getDate()+i);
    if(d.getFullYear() !== 2026) continue;
    const ds = iso(d);
    const entry = SCHEDULE[ds];
    const chip = document.createElement('button');
    chip.className = 'daychip';
    const isWeekend = entry && (entry.type==='saturday'||entry.type==='sunday');
    const isHoliday = entry && entry.type==='holiday';
    if(isWeekend) chip.classList.add('weekend');
    if(isHoliday) chip.classList.add('holiday');
    if(ds === iso(selected)) chip.classList.add('selected');
    chip.innerHTML = `<span class="cdow">${DOW_SHORT[d.getDay()]}</span><span class="cnum">${d.getDate()}</span><span class="cdot"></span>`;
    chip.onclick = ()=>{ selected = d; renderAll(); };
    strip.appendChild(chip);
  }
}

function initials(name){
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

const STEP_COLORS = ['#2C6E5F','#3C7C6C','#4C8A79','#5C9887','#6CA695','#1C2E29'];
const STEP_LABELS = ['1º a sair','2º a sair','3º a sair','4º a sair','5º a sair','Chefe da equipe'];

async function buildDayRows(dateISO, sectionKey, team, overrides){
  const order = ['P6','P5','P4','P3','P2','P1'];
  const wrap = document.createElement('div');
  wrap.className = 'rows';
  order.forEach((pos, idx)=>{
    const item = team.find(t=>t.pos===pos);
    const ovKey = sectionKey + '_' + pos;
    const overridden = overrides[ovKey];
    const name = overridden || item.name;
    const row = document.createElement('div');
    row.className = 'row' + (overridden ? ' is-edited' : '');
    const isChief = pos === 'P1';
    row.innerHTML = `
      <div class="step" style="background:${STEP_COLORS[idx]}">${pos}</div>
      <div class="rowmain">
        <div class="rowname">${name}${isChief ? '<span class="crown">👑</span>' : ''}${overridden ? '<span class="edited-tag">alterado</span>' : ''}</div>
        <div class="rowmeta">${STEP_LABELS[idx]}</div>
      </div>
      <div class="pencil">✎</div>
    `;
    row.onclick = ()=> openSheet(dateISO, ovKey, `${pos} · ${STEP_LABELS[idx]}`, name, overridden);
    wrap.appendChild(row);
  });
  return wrap;
}

function singleSlot(dateISO, key, label, name, overridden, colorVar){
  const el = document.createElement('div');
  el.className = 'single-slot' + (overridden ? ' is-edited' : '');
  el.innerHTML = `
    <div class="avatar" style="background:${colorVar}">${initials(name)}</div>
    <div class="rowmain">
      <div class="sname">${name}${overridden ? '<span class="edited-tag">alterado</span>' : ''}</div>
      <div class="smeta">${label}</div>
    </div>
    <div class="pencil">✎</div>
  `;
  el.onclick = ()=> openSheet(dateISO, key, label, name, overridden);
  return el;
}

async function renderContent(){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const dateISO = iso(selected);
  const entry = SCHEDULE[dateISO];
  if(!entry){
    content.innerHTML = '<div class="legend-note">Sem dados de escala para esta data.</div>';
    return;
  }
  const overrides = await getOverrides(dateISO);

  if(entry.type === 'saturday' || entry.type === 'sunday'){
    const card = document.createElement('div');
    card.className = 'card special';
    const label = entry.type==='saturday' ? 'Plantão de Sábado' : 'Plantão de Domingo';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">
          <div class="ico">${entry.type==='saturday'?'★':'☀'}</div>
          <div><h2>${label}</h2><div class="sub">Responsável único · 24h</div></div>
        </div>
        <span class="badge special">07h – 07h</span>
      </div>
    `;
    const ov = overrides['weekend'];
    const name = ov || entry.weekendDuty.name;
    card.appendChild(singleSlot(dateISO, 'weekend', 'Plantonista do dia · código '+entry.weekendDuty.code, name, ov, 'var(--special)'));
    content.appendChild(card);
    return;
  }

  if(entry.type === 'holiday'){
    const card = document.createElement('div');
    card.className = 'card special';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">
          <div class="ico">✦</div>
          <div><h2>Plantão de Feriado</h2><div class="sub">Responsável único pelo dia</div></div>
        </div>
        <span class="badge special">07h – 19h</span>
      </div>
    `;
    const ov = overrides['holiday'];
    const name = ov || entry.holiday.name;
    card.appendChild(singleSlot(dateISO, 'holiday', 'Plantonista do feriado · código '+entry.holiday.code, name, ov, 'var(--special)'));
    content.appendChild(card);
  } else if(entry.daySplit){
    const card = document.createElement('div');
    card.className = 'card day';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">
          <div class="ico">☼</div>
          <div><h2>Plantão Diurno</h2><div class="sub">Sexta-feira · semana ${entry.daySplit.semana} · ordem de saída</div></div>
        </div>
        <span class="badge day">07h – 19h</span>
      </div>
    `;
    const manhaLabel = document.createElement('div');
    manhaLabel.className = 'split-label'; manhaLabel.textContent = 'Manhã · 07h – 13h';
    card.appendChild(manhaLabel);
    card.appendChild(await buildDayRows(dateISO, 'manha', entry.daySplit.manha, overrides));
    const tardeLabel = document.createElement('div');
    tardeLabel.className = 'split-label'; tardeLabel.textContent = 'Tarde · 13h – 19h';
    card.appendChild(tardeLabel);
    card.appendChild(await buildDayRows(dateISO, 'tarde', entry.daySplit.tarde, overrides));
    content.appendChild(card);
  } else if(entry.dayTeam){
    const card = document.createElement('div');
    card.className = 'card day';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">
          <div class="ico">☼</div>
          <div><h2>Plantão Diurno</h2><div class="sub">Semana ${entry.dayTeam.semana} · ordem de saída</div></div>
        </div>
        <span class="badge day">07h – 19h</span>
      </div>
    `;
    card.appendChild(await buildDayRows(dateISO, 'day', entry.dayTeam.team, overrides));
    content.appendChild(card);
  }

  if(entry.night){
    const card = document.createElement('div');
    card.className = 'card night';
    card.innerHTML = `
      <div class="card-head">
        <div class="card-title">
          <div class="ico">☾</div>
          <div><h2>Plantão Noturno</h2><div class="sub">Responsável único</div></div>
        </div>
        <span class="badge night">19h – 07h</span>
      </div>
    `;
    const ov = overrides['night'];
    const name = ov || entry.night.name;
    card.appendChild(singleSlot(dateISO, 'night', 'Plantonista da noite · código '+entry.night.code, name, ov, 'var(--night)'));
    content.appendChild(card);
  }
}

function openSheet(dateISO, key, label, currentName, isOverridden){
  pendingSlot = {dateISO, key, label, currentName};
  document.getElementById('sheetTitle').textContent = 'Trocar plantonista';
  document.getElementById('sheetSub').textContent = label;
  const list = document.getElementById('rosterList');
  list.innerHTML = '';
  ROSTER.forEach(name=>{
    const btn = document.createElement('button');
    btn.textContent = name;
    if(name === currentName) btn.classList.add('current');
    btn.onclick = async ()=>{
      await saveOverride(dateISO, key, name);
      closeSheet();
      renderAll();
      showToast('Plantão atualizado ✓');
    };
    list.appendChild(btn);
  });
  document.getElementById('restoreBtn').style.display = isOverridden ? 'block' : 'none';
  document.getElementById('sheetBackdrop').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  pendingSlot = null;
}

document.getElementById('restoreBtn').onclick = async ()=>{
  if(!pendingSlot) return;
  await clearOverrideKey(pendingSlot.dateISO, pendingSlot.key);
  closeSheet();
  renderAll();
  showToast('Escala original restaurada');
};
document.getElementById('cancelBtn').onclick = closeSheet;
document.getElementById('sheetBackdrop').onclick = (e)=>{ if(e.target.id==='sheetBackdrop') closeSheet(); };

document.getElementById('prevBtn').onclick = ()=>{
  const d = new Date(selected); d.setDate(d.getDate()-1);
  if(d.getFullYear()===2026){ selected = d; renderAll(); }
};
document.getElementById('nextBtn').onclick = ()=>{
  const d = new Date(selected); d.setDate(d.getDate()+1);
  if(d.getFullYear()===2026){ selected = d; renderAll(); }
};
document.getElementById('todayBtn').onclick = ()=>{
  selected = new Date(2026,7,18);
  renderAll();
};
document.getElementById('dateOpenBtn').onclick = ()=>{
  const inp = document.getElementById('dateInput');
  if(inp.showPicker){ inp.showPicker(); } else { inp.focus(); inp.click(); }
};
document.getElementById('dateInput').onchange = (e)=>{
  if(e.target.value){ selected = fromISO(e.target.value); renderAll(); }
};
/* ---------- consulta de fins de semana / feriados ---------- */
function getStoredOverrideSync(dateISO, key){
  try{
    if(!STORAGE_OK) return null;
    const raw = localStorage.getItem('escala2026_'+dateISO);
    if(!raw) return null;
    const ov = JSON.parse(raw);
    return ov[key] || null;
  }catch(e){ return null; }
}

const SPECIAL_DAYS = (function(){
  const list = [];
  Object.keys(SCHEDULE).sort().forEach(dateISO=>{
    const entry = SCHEDULE[dateISO];
    if(entry.type === 'saturday' || entry.type === 'sunday'){
      const ov = getStoredOverrideSync(dateISO, 'weekend');
      list.push({
        date: dateISO, weekdayIdx: entry.weekdayIdx,
        kind: entry.type, code: entry.weekendDuty.code,
        name: ov || entry.weekendDuty.name
      });
    } else if(entry.type === 'holiday'){
      const ov = getStoredOverrideSync(dateISO, 'holiday');
      list.push({
        date: dateISO, weekdayIdx: entry.weekdayIdx,
        kind: 'holiday', code: entry.holiday.code,
        name: ov || entry.holiday.name
      });
    }
  });
  return list;
})();

let searchTab = 'name';
let searchName = null;
let searchMonth = new Date().getMonth() === 7 ? 7 : selected.getMonth(); // default current month view

function badgeInfo(kind){
  if(kind==='saturday') return {cls:'sat', label:'Sábado'};
  if(kind==='sunday') return {cls:'sun', label:'Domingo'};
  return {cls:'hol', label:'Feriado'};
}

function renderNameChips(){
  const wrap = document.getElementById('nameChips');
  wrap.innerHTML = '';
  ROSTER.forEach(name=>{
    const btn = document.createElement('button');
    btn.textContent = name;
    if(name === searchName) btn.classList.add('active');
    btn.onclick = ()=>{ searchName = (searchName===name) ? null : name; renderSearch(); };
    wrap.appendChild(btn);
  });
}
function renderMonthChips(){
  const wrap = document.getElementById('monthChips');
  wrap.innerHTML = '';
  MON_NAMES.forEach((m, idx)=>{
    const btn = document.createElement('button');
    btn.textContent = m;
    if(idx === searchMonth) btn.classList.add('active');
    btn.onclick = ()=>{ searchMonth = idx; renderSearch(); };
    wrap.appendChild(btn);
  });
}

function renderSearchResults(){
  const wrap = document.getElementById('searchResults');
  wrap.innerHTML = '';
  let items;
  if(searchTab === 'name'){
    items = searchName ? SPECIAL_DAYS.filter(d=>d.name===searchName) : [];
  } else {
    items = SPECIAL_DAYS.filter(d=> fromISO(d.date).getMonth() === searchMonth);
  }
  if(items.length === 0){
    const msg = searchTab === 'name' && !searchName
      ? 'Escolha um nome acima para ver os plantões dele.'
      : 'Nenhum plantão de fim de semana ou feriado encontrado.';
    wrap.innerHTML = `<div class="result-empty">${msg}</div>`;
    return;
  }
  items.forEach(item=>{
    const d = fromISO(item.date);
    const b = badgeInfo(item.kind);
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `
      <div class="result-date"><span class="rd-num">${d.getDate()}</span><span class="rd-mon">${MON_NAMES[d.getMonth()]}</span></div>
      <div class="result-main">
        <div class="result-name">${item.name}</div>
        <div class="result-meta">${DOW_NAMES[d.getDay()]} · ${item.code}</div>
      </div>
      <span class="result-badge ${b.cls}">${b.label}</span>
    `;
    row.onclick = ()=>{
      selected = d;
      closeSearchSheet();
      renderAll();
    };
    wrap.appendChild(row);
  });
}

function renderSearch(){
  document.getElementById('tabByName').classList.toggle('active', searchTab==='name');
  document.getElementById('tabByDate').classList.toggle('active', searchTab==='date');
  document.getElementById('panelByName').style.display = searchTab==='name' ? 'block' : 'none';
  document.getElementById('panelByDate').style.display = searchTab==='date' ? 'block' : 'none';
  renderNameChips();
  renderMonthChips();
  renderSearchResults();
}

function openSearchSheet(){
  renderSearch();
  document.getElementById('searchBackdrop').classList.add('open');
}
function closeSearchSheet(){
  document.getElementById('searchBackdrop').classList.remove('open');
}

document.getElementById('searchOpenBtn').onclick = openSearchSheet;
document.getElementById('searchCancelBtn').onclick = closeSearchSheet;
document.getElementById('searchBackdrop').onclick = (e)=>{ if(e.target.id==='searchBackdrop') closeSearchSheet(); };
document.getElementById('tabByName').onclick = ()=>{ searchTab='name'; renderSearch(); };
document.getElementById('tabByDate').onclick = ()=>{ searchTab='date'; renderSearch(); };

async function renderAll(){
  try{
    renderHeader();
    renderWeekStrip();
    await renderContent();
  }catch(err){
    const content = document.getElementById('content');
    if(content){
      content.innerHTML = '<div class="card special"><div class="card-head"><div class="card-title"><div class="ico">!</div><div><h2>Não foi possível carregar</h2><div class="sub">Erro ao montar a escala</div></div></div></div><p style="font-size:12px;color:var(--ink-soft);padding:10px 4px 4px;">'+String(err && err.message ? err.message : err)+'</p><p style="font-size:11.5px;color:var(--ink-faint);padding:0 4px 10px;">Dica: abra este arquivo diretamente no Chrome ou Safari (não numa pré-visualização do WhatsApp, Drive ou e-mail).</p></div>';
    }
    console.error(err);
  }
}
window.addEventListener('error', function(e){
  const content = document.getElementById('content');
  if(content && !content.innerHTML){
    content.innerHTML = '<div class="legend-note">Erro de JavaScript: '+e.message+'<br>Abra este arquivo direto no navegador (Chrome/Safari), não em uma pré-visualização de app.</div>';
  }
});
renderAll();

</script>
</body>
</html>
